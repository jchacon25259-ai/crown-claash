<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crown Clash LAN</title><style>body{font:16px system-ui;background:#111827;color:white;text-align:center;margin:0;padding:12px}header{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap}canvas{background:#77b875;border:5px solid #d9aa60;border-radius:12px;width:min(96vw,420px);height:auto;touch-action:manipulation}button{font-size:16px;padding:12px;margin:5px;border:0;border-radius:8px;background:#5677c5;color:white}.selected{background:#c37e29}#status{min-height:2em}input{padding:10px;font-size:16px;width:180px}</style></head><body><h2>👑 Crown Clash LAN</h2><header><span id="side">Connecting</span><span id="clock">2:00</span><span id="elixir">Elixir 5</span></header><p id="status">Connecting to server...</p><canvas id="arena" width="420" height="640"></canvas><div id="cards"></div><p>Pick a troop then tap your half of the arena</p><button onclick="location.reload()">Reconnect</button><script>
const c=document.getElementById('arena'),ctx=c.getContext('2d'),cards=document.getElementById('cards');let me=0,state=null,selected='Knight';const types={Knight:3,Archer:3,Giant:5,Runner:2};Object.entries(types).forEach(([name,cost])=>{let b=document.createElement('button');b.textContent=name+' '+cost;b.onclick=()=>{selected=name;document.querySelectorAll('#cards button').forEach(x=>x.classList.toggle('selected',x===b))};cards.append(b)});cards.firstChild.classList.add('selected');let ws;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hello'){me=m.player;document.getElementById('side').textContent='You are '+(me===0?'Blue (bottom)':'Red (top)')}if(m.type==='state'){state=m.state;document.getElementById('elixir').textContent='Elixir '+Math.floor(state.elixir[me]||0)+'/10';document.getElementById('clock').textContent=Math.floor(state.time/60)+':'+String(state.time%60).padStart(2,'0');document.getElementById('status').textContent=state.message}if(m.type==='error')document.getElementById('status').textContent=m.message};ws.onclose=()=>document.getElementById('status').textContent='Disconnected. Press Reconnect.'}connect();c.addEventListener('click',e=>{if(!state||ws.readyState!==1)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*420/r.width,y=(e.clientY-r.top)*640/r.height;ws.send(JSON.stringify({type:'deploy',unit:selected,x,y}))});function draw(){ctx.clearRect(0,0,420,640);ctx.fillStyle='#77b875';ctx.fillRect(0,0,420,640);ctx.fillStyle='#5aa3d5';ctx.fillRect(0,301,420,38);ctx.fillStyle='#ad8254';ctx.fillRect(72,300,65,40);ctx.fillRect(285,300,65,40);ctx.strokeStyle='#ffffff70';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(210,0);ctx.lineTo(210,640);ctx.stroke();ctx.setLineDash([]);if(state){for(let t of state.towers){ctx.fillStyle=t.team===0?'#3175d4':'#cb4545';ctx.fillRect(t.x-24,t.y-22,48,44);ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('♜',t.x,t.y+4);ctx.fillText(Math.ceil(t.hp),t.x,t.y-30)}for(let u of state.units){ctx.beginPath();ctx.fillStyle=u.team===0?'#2369db':'#e34747';ctx.arc(u.x,u.y,u.type==='Giant'?16:11,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(u.type[0],u.x,u.y+4)}}requestAnimationFrame(draw)}draw();</script></body></html>
